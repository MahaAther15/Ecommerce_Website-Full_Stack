name: Backend CI/CD - MonsterASP

on:
  push:
    branches:
      - main
    paths:
      - "ecommerce-backend/**"
      - ".github/workflows/backend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "ecommerce-backend/**"

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 3. Restore NuGet packages
      - name: Restore dependencies
        working-directory: ecommerce-backend
        run: dotnet restore

      # 4. Build backend
      - name: Build
        working-directory: ecommerce-backend
        run: dotnet build --configuration Release --no-restore

      # 5. Run tests (if any test projects exist)
      - name: Test
        working-directory: ecommerce-backend
        run: dotnet test --configuration Release --verbosity normal --no-build || true

      # 6. Publish backend
      - name: Publish
        working-directory: ecommerce-backend
        run: dotnet publish --configuration Release --output ./publish

      # 7. Deploy to MonsterASP using WebDeploy
      - name: Deploy to MonsterASP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME || 'site88404' }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME || 'https://site88404.siteasp.net:8172/msdeploy.axd' }}
          server-username: ${{ secrets.SERVER_USERNAME || 'site88404' }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./ecommerce-backend/publish
